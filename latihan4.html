<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>form biodata siswa</title>
        <link rel="stylesheet" hreef="latihan3.css">
    </head>
    <body>
<h1>form Biodata Siswa</h1>

<form>
    <label for="nim">Nim:</label>
    <input type="text" id="nim" name="nim"
           placeholder="masukan NIM">
    <br><br>

    <label for="nama">nama lengkap</label>
    <input type="text" id="nama" name="nama"
           placeholder="masukan nama lengkap">
    <br><br>
    
    <label for="kelas">kelas</label>
    <select id="kelas" name="kelas">
        <option value="">-- pilih kelas --</option>
        <option value="x">x</option>
        <option value="XI">XI</option>
        <option value="XII">XII</option>
    </select>
    <br><br>

    <input type="checkbox" id="akl" name="jurusan" value="akl">
    <label for="akl">AKL</label>
    <br>

    <input type="checkbox" id="mplb" name="jurusan" value="mplb">
    <label for="mplb">MPLB</label>
    <br>

    <input type="checkbox" id="tjkt" name="jurusan" value="TJKT">
    <label for="tjkt"TJKT></label>
    <br>

    <input type="checkbox" id="tkr" name="jurusan" value="Tkr">
    <label for="tkr"tkr></label>
    <br><br>

    <label for="tempat">tempat, tanggal lahir:</label>
    <br>

    <input type="text" id="tempat" name="tempat"
    placeholder="tempat lahir">
    <br>

    <input type="date" id="tanggal" name="tanggal">
    <br><br>

    <label>jenis kelamin:</label>
    <br>

    <input type="checkbox id="laki" name="gender"
